# Creates Prisma migration files on GitHub's runners, where Prisma's engine
# binaries can be downloaded. Runs when the schema changes on any branch:
#  - no migrations yet  -> writes prisma/migrations/0_init from the schema
#  - migrations exist   -> replays them on a throwaway Postgres and writes a
#                          new migration for whatever the schema adds
# The new files are committed back to the same branch.
name: Prisma migrations

on:
  push:
    paths:
      - "prisma/schema.prisma"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prisma" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Write migration
        run: |
          set -euo pipefail
          if [ ! -d prisma/migrations ] || [ -z "$(ls -A prisma/migrations 2>/dev/null | grep -v migration_lock.toml || true)" ]; then
            mkdir -p prisma/migrations/0_init
            npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script \
              > prisma/migrations/0_init/migration.sql
            printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' \
              > prisma/migrations/migration_lock.toml
          else
            npx prisma migrate deploy
            name="$(date -u +%Y%m%d%H%M%S)_schema_update"
            mkdir -p "prisma/migrations/$name"
            npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script \
              > "prisma/migrations/$name/migration.sql"
            if ! grep -qvE '^\s*(--.*)?$' "prisma/migrations/$name/migration.sql"; then
              rm -rf "prisma/migrations/$name"
            fi
          fi

      - name: Check migrations apply cleanly
        run: npx prisma migrate reset --force

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain prisma/migrations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prisma/migrations
            git commit -m "Add Prisma migration for schema changes"
            git push
          else
            echo "Migrations already match the schema."
          fi
